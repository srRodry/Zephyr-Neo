plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

def mobile = rootProject.file('../engines/zephyr-mobile')
def generatedAssets = layout.buildDirectory.dir('generated/mobileAssets')
def syncMobileAssets = tasks.register('syncMobileAssets', Sync) {
    into generatedAssets
    into('game-patches') {
        from(new File(mobile, 'patches/xenia-canary/patches')) { include '*.patch.toml' }
    }
    into('engine-licenses') {
        from(new File(mobile, 'THIRD-PARTY-NOTICES.md')) { rename { 'xendroid-notices.txt' } }
        def vendor = new File(mobile, 'emulator-core/src/main/cpp/third_party')
        from(new File(vendor, 'winfg/LICENSE')) { rename { 'winfg-MIT.txt' } }
        from(new File(vendor, 'winfg/THIRD-PARTY.md')) { rename { 'winfg-third-party.txt' } }
        from(new File(vendor, 'winfg/NOTICE_FIDELITYFX_OPTICALFLOW.md')) { rename { 'fidelityfx-notice.txt' } }
        from(new File(vendor, 'lsfg/LICENSE')) { rename { 'lsfg-GPL-3.0.txt' } }
        from(new File(vendor, 'lsfg-dxbc/LICENSE.md')) { rename { 'dxbc-license.txt' } }
        from(new File(vendor, 'sgsr/LICENSE')) { rename { 'sgsr-BSD-3-Clause.txt' } }
    }
}
tasks.named('preBuild').configure { dependsOn(syncMobileAssets) }

android {
    namespace 'xendroid.compose'
    compileSdk 36

    defaultConfig {
        minSdk 29
        buildConfigField 'String', 'APPLICATION_ID', '"com.pixelcode.zephyrneo.debug"'
        buildConfigField 'String', 'VERSION_NAME', '"0.1"'
        buildConfigField 'int', 'VERSION_CODE', '1'
        ['BUILD_CHANGESET', 'UPDATE_REPOSITORY', 'CATALOG_URL', 'CATALOG_KEYS', 'COMMUNITY_URL'].each {
            buildConfigField 'String', it, '""'
        }
        buildConfigField 'String', 'BUILD_BASE_COMMIT', '"55096e30"'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    sourceSets.main {
        java.srcDir(new File(mobile, 'app/src/main/java'))
        res.srcDir(new File(mobile, 'app/src/main/res'))
        assets.srcDirs(new File(mobile, 'app/src/main/assets'), generatedAssets)
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

dependencies {
    api project(':emulator-core')
    implementation platform(libs.compose.bom)
    implementation libs.compose.ui
    implementation libs.compose.ui.graphics
    implementation libs.compose.ui.tooling.preview
    implementation libs.compose.material3
    implementation libs.androidx.activity.compose
    implementation libs.androidx.navigation.compose
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.lifecycle.runtime.compose
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.window:window:1.3.0'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation libs.coil.compose
    implementation libs.kotlinx.serialization.json
    implementation libs.androidx.datastore.preferences
}
